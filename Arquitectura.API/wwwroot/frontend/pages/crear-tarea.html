<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/theme.js?v=39"></script>
    <title>Crear Tarea - CEGA</title>
    <link rel="stylesheet" href="../css/styles.css?v=39">
</head>
<body class="module-page project-module-page wide-form-view">

    <header class="main-header module-hidden-header">
        <h1>Crear Tarea</h1>
        <p>Registro de tarea asociada a un proyecto</p>
    </header>

    <nav class="navbar">
        <div class="navbar-left">
            <a href="../index.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a id="volverDetalle" href="#">Volver al Proyecto</a>
            <a href="contabilidad.html">Contabilidad</a>
        </div>

        <div class="navbar-right">
            <div id="usuarioSesion"></div>
            <button class="theme-toggle" type="button" data-theme-toggle title="Cambiar tema">Modo oscuro</button>
        </div>
    </nav>

    <main class="dashboard-shell module-shell">
        <section class="module-hero">
            <div>
                <p class="eyebrow">Nueva tarea</p>
                <h1>Crear Tarea</h1>
                <p>Registro de tarea asociada a un proyecto.</p>
            </div>
        </section>
        <section class="form-card wide-form-card">
            <h2>Datos de la tarea</h2>

            <input type="hidden" id="proyectoId">

            <div class="wide-form-grid">
                <div class="form-group">
                    <label>Proyecto ID</label>
                    <input type="number" id="proyectoIdVisible" disabled>
                </div>

                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="titulo" placeholder="Ejemplo: Revisión de planos">
                </div>

                <div class="form-group">
                    <label>Fecha de inicio</label>
                    <input type="date" id="fechaInicio">
                </div>

                <div class="form-group">
                    <label>Fecha de fin</label>
                    <input type="date" id="fechaFin">
                </div>

                <div class="form-group full-span">
                    <label>Descripción</label>
                    <textarea id="descripcion" placeholder="Descripción de la tarea"></textarea>
                </div>
            </div>

            <div class="form-actions-row">
                <button class="btn-secondary" onclick="crearTarea()">Guardar Tarea</button>
                <a id="btnCancelar" class="btn-danger" href="#">Cancelar</a>
            </div>

            <p id="mensajeTarea" class="message"></p>
        </section>
    </main>

    <footer>
        <p>CEGA Arquitectura — Sistema de Administración de Proyectos, Tareas y Contabilidad</p>
    </footer>

    <script src="../js/api.js?v=39"></script>
    <script src="../js/auth.js?v=39"></script>
    <script src="../js/tareas.js?v=39"></script>
    <script>
        validarSesion();
        pintarUsuarioEnNavbar();
        prepararFormularioCrearTarea();
    </script>

</body>
</html>
