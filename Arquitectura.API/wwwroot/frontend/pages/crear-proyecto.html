<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/theme.js?v=17"></script>
    <title>Crear Proyecto - CEGA</title>
    <link rel="stylesheet" href="../css/styles.css?v=17">
</head>
<body>

    <header class="main-header">
        <h1>Crear Nuevo Proyecto</h1>
        <p>Registro de proyecto y asignación inicial de empleados</p>
    </header>

        <nav class="navbar">
        <div class="navbar-left">
            <a href="../index.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="contabilidad.html">Contabilidad</a>
        </div>

        <div class="navbar-right">
            <div id="usuarioSesion"></div>
            <button class="theme-toggle" type="button" data-theme-toggle title="Cambiar tema">Modo oscuro</button>
        </div>
    </nav>

    <main class="container">
        <section class="form-card">
            <h2>Datos del proyecto</h2>

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="nombre" placeholder="Ejemplo: Proyecto Casa Moderna">
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea id="descripcion" placeholder="Descripción general del proyecto"></textarea>
            </div>

            <div class="form-group">
                <label>Fecha de inicio</label>
                <input type="date" id="fechaInicio">
            </div>

            <h2 style="margin-top: 25px;">Asignar empleados al proyecto</h2>
            <p>
                Seleccione los empleados que participarán en el proyecto.
                El rol se guardará como parte de la asignación.
            </p>

            <div id="listaEmpleadosAsignar" class="table-container">
                Cargando empleados...
            </div>

            <button class="btn-secondary" onclick="crearProyectoConAsignaciones()">Guardar Proyecto</button>
            <a class="btn-danger" href="proyectos.html">Cancelar</a>

            <p id="mensajeProyecto" class="message"></p>
        </section>
    </main>

    <script src="../js/api.js?v=17"></script>
    <script src="../js/auth.js?v=17"></script>
    <script src="../js/proyectos.js?v=17"></script>

    <script>
        validarSesion();
        pintarUsuarioEnNavbar();

        if (!usuarioEsAdmin()) {
            alert("Solo el administrador puede crear proyectos.");
            window.location.href = "proyectos.html";
        }

        cargarEmpleadosParaNuevoProyecto();
    </script>

</body>
</html>
