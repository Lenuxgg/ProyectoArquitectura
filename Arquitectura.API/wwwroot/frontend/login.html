<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - CEGA</title>
    <script src="js/theme.js?v=41"></script>
    <link rel="stylesheet" href="css/styles.css?v=41">
</head>
<body class="login-page">

    <header class="main-header login-header">
        <h1>CEGA Arquitectura</h1>
        <p>Sistema de Administración de Proyectos, Tareas y Contabilidad</p>
    </header>

    <main class="login-shell">
        <section class="card login-card login-card-single">
            <div class="login-theme-row">
                <button class="theme-toggle" type="button" data-theme-toggle>Modo oscuro</button>
            </div>

            <div class="login-title-block">
                <p class="eyebrow">Acceso seguro</p>
                <h2>Inicio de sesión</h2>
                <p>Ingrese sus credenciales para continuar.</p>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Ingrese su correo electrónico" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" autocomplete="current-password">
            </div>

            <button class="btn-primary login-submit" type="button" onclick="iniciarSesion()">Ingresar</button>

            <p id="mensajeLogin" class="message"></p>
        </section>
    </main>

    <script src="js/auth.js?v=41"></script>

</body>
</html>
